# Catálogo semilla de contratos; no representa cobertura total.
schemaVersion: 1
releaseId: rt-20261107-01
status: DRAFT_F1_PRELIMINARY
ownerPolicy: "El servicio dueño resuelve audiencia en servidor; scope final debe auditase en F0/F6"
globalEnvelope:
  eventId: uuid
  eventType: versioned_name
  schemaVersion: positive_integer
  aggregateType: string
  aggregateId: string
  aggregateVersion: positive_integer
  occurredAtUtc: utc_datetime
  producer: service_name
  correlationId: string
  audienceRef: server_side_resource_ref
  payload: minimal_json_object
  traceId: optional_string
  personalDataAllowed: false
  sourceOfTruth: REST
candidates:

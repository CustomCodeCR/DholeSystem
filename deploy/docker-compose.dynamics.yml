# Dhole Dynamics Connector: same PostgreSQL server as DholeSystem, separate database.
# Run in a separate project to preserve independent API, worker and key volumes.
# Shared Docker network is environment-scoped (dhole/dhole-staging).
services:
  dynamics-key-init:
    image: busybox:1.36
    restart: "no"
    user: "0:0"
    volumes:
      - dynamics_runtime_keys:/data/dynamics-keys
    command:
      - sh
      - -ec
      - |
        umask 077
        cd /data/dynamics-keys
        for file in encryption_key cursor_key; do
          if [ ! -s "$$file" ]; then
            if [ -e "$$file" ]; then
              echo "Invalid existing Dynamics key: $$file" >&2
              exit 1
            fi
            head -c 32 /dev/urandom | base64 | tr -d '\n' > "$$file.tmp"
            mv "$$file.tmp" "$$file"
          fi
          chmod 600 "$$file"
        done
        chown -R 1654:1654 /data/dynamics-keys
        chmod 700 /data/dynamics-keys
    security_opt: [no-new-privileges:true]

  dynamics-migrate:
    image: dhole/dynamics-tools:${DYNAMICS_IMAGE_TAG:?DYNAMICS_IMAGE_TAG required}
    restart: "no"
    command: ["migrate"]
    environment:
      ConnectionStrings__Dynamics: "Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${DYNAMICS_DB:?DYNAMICS_DB required};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    networks:
      - dhole_runtime
    security_opt: [no-new-privileges:true]

  dynamics-api:
    image: dhole/dynamics-api:${DYNAMICS_IMAGE_TAG:?DYNAMICS_IMAGE_TAG required}
    restart: unless-stopped
    environment: &dynamics_env
      TZ: ${TZ:-America/Costa_Rica}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?}
      ASPNETCORE_URLS: http://+:8080
      DYNAMICS_AUTH_MODE: Dhole
      # OAuth2 machine-to-machine issuer and API audience for external applications.
      # Empty by default: M2M remains disabled until Entra IDs are explicitly configured.
      M2m__Authority: ${DYNAMICS_M2M_AUTHORITY:-}
      M2m__Audience: ${DYNAMICS_M2M_AUDIENCE:-}
      # Match the existing Gateway CORS origin for authenticated admin responses,
      # including non-2xx dependency errors. No wildcard or arbitrary origins.
      Admin__CorsOrigins__0: ${CORS_WEB_ORIGIN:?Dhole web CORS origin required}
      DYNAMICS_LOCAL_KEYS_DIR: /data/dynamics-keys
      DYNAMICS_ENCRYPTION_ACTIVE_KEY_VERSION: "1"
      ConnectionStrings__Dynamics: "Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${DYNAMICS_DB:?DYNAMICS_DB required};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      DholeAuth__Issuer: ${JWT_ISSUER:?}
      DholeAuth__Audience: ${JWT_AUDIENCE:?}
      DholeAuth__SecretKey: ${JWT_SECRET:?}
      Jobs__Enabled: "false"
      Metadata__SchedulerEnabled: "false"
      ProductionWrites__Approved: ${DYNAMICS_PRODUCTION_WRITES_APPROVED:-NO}
      ProductionWrites__ApprovalReference: ${DYNAMICS_PRODUCTION_WRITES_TICKET:-}
      ProductionWrites__DeletesApproved: ${DYNAMICS_PRODUCTION_DELETES_APPROVED:-NO}
      ProductionWrites__DeletesApprovalReference: ${DYNAMICS_PRODUCTION_DELETES_TICKET:-}
    volumes:
      - dynamics_runtime_keys:/data/dynamics-keys:ro
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      dynamics-key-init: {condition: service_completed_successfully}
      dynamics-migrate: {condition: service_completed_successfully}
    expose: ["8080"]
    networks:
      dhole_runtime:
        aliases: [dynamics-api]
    security_opt: [no-new-privileges:true]

  dynamics-worker:
    image: dhole/dynamics-api:${DYNAMICS_IMAGE_TAG:?DYNAMICS_IMAGE_TAG required}
    restart: unless-stopped
    environment:
      <<: *dynamics_env
      ASPNETCORE_URLS: http://127.0.0.1:8080
      # Dedicated worker: metadata discovery only. No sync, import or write jobs.
      Jobs__Enabled: "true"
      Jobs__MetadataOnly: "true"
    volumes:
      - dynamics_runtime_keys:/data/dynamics-keys:ro
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      dynamics-key-init: {condition: service_completed_successfully}
      dynamics-migrate: {condition: service_completed_successfully}
    networks:
      - dhole_runtime
    security_opt: [no-new-privileges:true]

networks:
  dhole_runtime:
    external: true
    name: ${DHOLE_NETWORK:?Environment-specific Dhole network required}

volumes:
  dynamics_runtime_keys:

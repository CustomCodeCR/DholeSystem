services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ${DHOLE_ENV_FILE}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dhole-staging-postgres:/var/lib/postgresql/data
    networks:
      - dhole-staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7.0.40
    restart: unless-stopped
    env_file:
      - ${DHOLE_ENV_FILE}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - dhole-staging-mongo:/data/db
    networks:
      - dhole-staging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - dhole-staging-redis:/data
    networks:
      - dhole-staging

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    env_file:
      - ${DHOLE_ENV_FILE}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - dhole-staging-minio:/data
    networks:
      - dhole-staging

  hermes-config-init-staging:
    image: alpine:3.20
    container_name: hermes-config-init-staging
    env_file:
      - ${DHOLE_ENV_FILE}
    environment:
      HERMES_OLLAMA_MODEL: ${HERMES_OLLAMA_MODEL:-mistral-nemo:12b}
      HERMES_CONTEXT_LENGTH: ${HERMES_CONTEXT_LENGTH:-65536}
    volumes:
      - dhole-staging-hermes:/opt/data
    entrypoint:
      - /bin/sh
      - -ec
      - |
        cat > /opt/data/config.yaml <<EOF
        model:
          default: ${HERMES_OLLAMA_MODEL}
          provider: custom
          base_url: http://ollama:11434/v1
          context_length: ${HERMES_CONTEXT_LENGTH}
        EOF
        chmod 600 /opt/data/config.yaml
        echo "Hermes staging config generated for local Ollama model: ${HERMES_OLLAMA_MODEL}"
    restart: "no"

  hermes-agent-staging:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent-staging
    command: ["gateway", "run"]
    depends_on:
      hermes-config-init-staging:
        condition: service_completed_successfully
    env_file:
      - ${DHOLE_ENV_FILE}
    environment:
      TZ: America/Costa_Rica
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY}
      API_SERVER_MODEL_NAME: ${HERMES_API_SERVER_MODEL_NAME:-hermes-agent}
    ports:
      - "127.0.0.1:18642:8642"
    volumes:
      - dhole-staging-hermes:/opt/data
    shm_size: "2gb"
    networks:
      dhole-staging:
        aliases:
          - hermes-agent
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8642/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 40s

networks:
  dhole-staging:
    external: true
    name: dhole-staging

volumes:
  dhole-staging-postgres:
  dhole-staging-mongo:
  dhole-staging-redis:
  dhole-staging-minio:
  dhole-staging-hermes:

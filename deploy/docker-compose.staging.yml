services:
  # Catalog realtime pilot enabled in staging ONLY; production stays fail-closed.
  notifications-api:
    environment:
      Features__UniversalRealtimeEnabled: "true"
      Realtime__NotificationsHostEnabled: "true"
      Realtime__DeploymentTarget: "staging"
      Realtime__ProductionApproved: "false"
      Realtime__ReleaseId: "rt-20261107-01"

  config-api:
    environment:
      Features__UniversalRealtimeEnabled: "true"
      Realtime__Outbox__Enabled: "true"
      Realtime__BatchApproved: "true"
      Realtime__ReleaseId: "rt-20261107-01"

  config-workers:
    environment:
      Features__UniversalRealtimeEnabled: "true"
      Realtime__Outbox__Enabled: "true"
      Realtime__BatchApproved: "true"
      Realtime__ReleaseId: "rt-20261107-01"

  # Enable Pricing/CRM durable collection invalidations only in staging.
  pricing-api:
    environment:
      Features__UniversalRealtimeEnabled: "true"
      Realtime__Outbox__Enabled: "true"
      Realtime__BatchApproved: "true"
      Realtime__ReleaseId: "rt-20261107-01"

  pricing-workers:
    environment:
      Features__UniversalRealtimeEnabled: "true"
      Realtime__Outbox__Enabled: "true"
      Realtime__BatchApproved: "true"
      Realtime__ReleaseId: "rt-20261107-01"

  crm-api:
    environment:
      Features__UniversalRealtimeEnabled: "true"
      Realtime__Outbox__Enabled: "true"
      Realtime__BatchApproved: "true"
      Realtime__ReleaseId: "rt-20261107-01"

  crm-workers:
    environment:
      Features__UniversalRealtimeEnabled: "true"
      Realtime__Outbox__Enabled: "true"
      Realtime__BatchApproved: "true"
      Realtime__ReleaseId: "rt-20261107-01"

  api-gateway:
    environment:
      CONTENT_HTTP_URL: http://content-api:8080
      AGENT_HTTP_URL: http://dhole-agent-api:8080
      HERMES_HTTP_URL: http://hermes-agent:8642
    ports:
      - "127.0.0.1:18080:8080"

  dhole-web:
    ports:
      - "127.0.0.1:18081:80"

  website:
    ports:
      - "127.0.0.1:18082:80"

  content-api:
    ports:
      - "127.0.0.1:18210:8080"

  dhole-agent-api:
    ports:
      - "127.0.0.1:18211:8080"

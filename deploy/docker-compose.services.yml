include:
  - path: /opt/dhole/docker-compose.services.yml

services:
  api-gateway:
    environment:
      CONTENT_HTTP_URL: http://content-api:8080
      # The prod2+ Compose projects also advertise the generic
      # dhole-agent-api DNS alias on the shared dhole network. Bind the
      # gateway only to the uniquely named primary API container.
      # Without this override, /api/agents may randomly reach prod2,
      # where the production dispatcher is deliberately disabled.
      AGENT_HTTP_URL: http://dhole-dhole-agent-api-1:8080
      Gateway__Routes__11__Destination: http://dhole-dhole-agent-api-1:8080
      HERMES_HTTP_URL: http://hermes-agent:8642
      CRM_HTTP_URL: ${CRM_HTTP_URL:-http://crm-api:8080}
      Gateway__Routes__12__Destination: ${CRM_HTTP_URL:-http://crm-api:8080}
      Gateway__Routes__12__Prefix: "/api/crm"
      Gateway__HealthChecks__crm: ${CRM_HTTP_URL:-http://crm-api:8080}
      # Standalone OAuth2/Dataverse connector. Route maps public /api/dynamics-connector/*
      # to /api/v1/* inside the independently deployed Dynamics API.
      Gateway__Routes__13__Prefix: "/api/dynamics-connector"
      Gateway__Routes__13__Destination: "${DYNAMICS_HTTP_URL:-http://dynamics-api:8080}/api/v1"
      Gateway__Routes__13__StripPrefix: "true"
      Gateway__Routes__13__TimeoutSeconds: "120"
      Gateway__HealthChecks__dynamics-connector: "${DYNAMICS_HTTP_URL:-http://dynamics-api:8080}"
      # DholeAuth user-only administrative connection configuration.
      Gateway__Routes__14__Prefix: "/api/dynamics-admin"
      Gateway__Routes__14__Destination: "${DYNAMICS_HTTP_URL:-http://dynamics-api:8080}/api/admin/v1"
      Gateway__Routes__14__StripPrefix: "true"
      Gateway__Routes__14__TimeoutSeconds: "120"
    networks:
      - dhole-runtime

  content-api:
    image: dhole/content-api:${DHOLE_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ${DHOLE_ENV_FILE}
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: ${CONTENT_POSTGRES_CONNECTION}
      Redis__ConnectionString: ${CONTENT_REDIS_CONNECTION:-redis:6379}
      Auth__Jwt__SecretKey: ${AUTH_JWT_SECRET}
      ServiceUrls__Storage: ${STORAGE_BASE_URL:-http://192.168.1.12:5207/}
    networks:
      - dhole-runtime

  content-workers:
    image: dhole/content-workers:${DHOLE_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ${DHOLE_ENV_FILE}
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: ${CONTENT_POSTGRES_CONNECTION}
      Redis__ConnectionString: ${CONTENT_REDIS_CONNECTION:-redis:6379}
    depends_on:
      - content-api
    networks:
      - dhole-runtime

  dhole-agent-api:
    image: dhole/agent-api:${DHOLE_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ${DHOLE_ENV_FILE}
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      Postgres__ConnectionString: ${AGENT_POSTGRES_CONNECTION_STRING}
      Redis__ConnectionString: ${AGENT_REDIS_CONNECTION_STRING:-redis:6379}
      Auth__Authority: ${AUTH_HTTP_URL:-http://auth-api:8080}
      Auth__Audience: ${AUTH_AUDIENCE:-dhole}
      Hermes__BaseUrl: ${HERMES_GATEWAY_URL:-http://hermes-agent:8642}
      Hermes__ApiKey: ${HERMES_API_SERVER_KEY}
      Hermes__Model: ${HERMES_API_SERVER_MODEL_NAME:-hermes-agent}
      Hermes__ExecutePath: /v1/chat/completions
      Hermes__TimeoutSeconds: ${HERMES_AGENT_HTTP_TIMEOUT_SECONDS:-600}
      Hermes__TaskTimeoutSeconds: ${HERMES_AGENT_TASK_TIMEOUT_SECONDS:-300}
      Hermes__MaxParallelTasks: ${HERMES_AGENT_MAX_PARALLEL_TASKS:-2}
      CredentialProtection__KeyRingPath: /data/agent-keys
    volumes:
      - agent-data-protection-keys:/data/agent-keys
    networks:
      - dhole-runtime

  dhole-agent-workers:
    image: dhole/agent-workers:${DHOLE_IMAGE_TAG:-latest}
    entrypoint: ["/app/start-worker.sh"]
    restart: unless-stopped
    env_file:
      - ${DHOLE_ENV_FILE}
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Postgres__ConnectionString: ${AGENT_POSTGRES_CONNECTION_STRING}
      Redis__ConnectionString: ${AGENT_REDIS_CONNECTION_STRING:-redis:6379}
      Hermes__BaseUrl: ${HERMES_GATEWAY_URL:-http://hermes-agent:8642}
      Hermes__ApiKey: ${HERMES_API_SERVER_KEY}
      Hermes__Model: ${HERMES_API_SERVER_MODEL_NAME:-hermes-agent}
      Hermes__ExecutePath: /v1/chat/completions
      Hermes__TimeoutSeconds: ${HERMES_AGENT_HTTP_TIMEOUT_SECONDS:-600}
      Hermes__TaskTimeoutSeconds: ${HERMES_AGENT_TASK_TIMEOUT_SECONDS:-300}
      Hermes__MaxParallelTasks: ${HERMES_AGENT_MAX_PARALLEL_TASKS:-2}
      Browser__ProfilesPath: /data/browser-profiles
      Browser__Headless: "false"
      AGENT_NOVNC_ENABLED: "true"
      AGENT_NOVNC_PORT: "6080"
      CredentialProtection__KeyRingPath: /data/agent-keys
      MAERSK_USERNAME: ${MAERSK_USERNAME:-}
      MAERSK_PASSWORD: ${MAERSK_PASSWORD:-}
    volumes:
      - agent-browser-profiles:/data/browser-profiles
      - agent-data-protection-keys:/data/agent-keys
    ports:
      - "127.0.0.1:${AGENT_NOVNC_HOST_PORT:-6080}:6080"
    shm_size: "2gb"
    networks:
      - dhole-runtime

  # ==========================================================
  # CRM - API + background workers
  # ==========================================================

  crm-api:
    image: dhole/crm-api:${DHOLE_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ${DHOLE_ENV_FILE:-/opt/dhole/.env}
    environment:
      TZ: ${TZ:-America/Costa_Rica}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      Kestrel__Endpoints__Http__Url: "http://+:8080"
      Kestrel__Endpoints__Http__Protocols: "Http1"
      Kestrel__Endpoints__Grpc__Url: "http://+:8081"
      Kestrel__Endpoints__Grpc__Protocols: "Http2"
      ConnectionStrings__Postgres: "Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${CRM_DB:-dhole_crm};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Postgres__ConnectionString: "Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${CRM_DB:-dhole_crm};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Redis__ConnectionString: ${REDIS_CONNECTION_STRING:-redis:6379}
      Auth__Jwt__Issuer: ${JWT_ISSUER:-DholeAuthService}
      Auth__Jwt__Audience: ${JWT_AUDIENCE:-DholeEcosystem}
      Auth__Jwt__SecretKey: ${JWT_SECRET}
      Auth__Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-30}
      Auth__Jwt__RequireHttpsMetadata: ${JWT_REQUIRE_HTTPS_METADATA:-false}
      Auth__Client__BaseAddress: ${AUTH_HTTP_URL:-http://auth-api:8080}
      Auth__Client__InternalServiceKeyHeader: "X-Dhole-Service-Key"
      Auth__Client__InternalServiceKey: ${INTERNAL_SERVICE_KEY}
      Grpc__Clients__Config__Address: ${CONFIG_GRPC_URL:-http://config-api:8081}
      Integrations__Pricing__BaseUrl: ${PRICING_HTTP_URL:-http://pricing-api:8080}
      Integrations__AuditLogs__BaseUrl: ${AUDITLOGS_HTTP_URL:-http://auditlogs-api:8080}
      Integrations__Notifications__BaseUrl: ${NOTIFICATIONS_HTTP_URL:-http://notifications-api:8080}
      Integrations__Storage__BaseUrl: ${STORAGE_HTTP_URL:-http://storage-api:5207}
      Cors__AllowedOrigins__0: ${CORS_WEB_ORIGIN}
    expose:
      - "8080"
      - "8081"
    networks:
      - dhole-runtime

  crm-workers:
    image: dhole/crm-workers:${DHOLE_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ${DHOLE_ENV_FILE:-/opt/dhole/.env}
    environment:
      TZ: ${TZ:-America/Costa_Rica}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: "Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${CRM_DB:-dhole_crm};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Postgres__ConnectionString: "Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${CRM_DB:-dhole_crm};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Redis__ConnectionString: ${REDIS_CONNECTION_STRING:-redis:6379}
      Auth__Jwt__Issuer: ${JWT_ISSUER:-DholeAuthService}
      Auth__Jwt__Audience: ${JWT_AUDIENCE:-DholeEcosystem}
      Auth__Jwt__SecretKey: ${JWT_SECRET}
      Auth__Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-30}
      Auth__Jwt__RequireHttpsMetadata: ${JWT_REQUIRE_HTTPS_METADATA:-false}
      Auth__Client__BaseAddress: ${AUTH_HTTP_URL:-http://auth-api:8080}
      Auth__Client__InternalServiceKeyHeader: "X-Dhole-Service-Key"
      Auth__Client__InternalServiceKey: ${INTERNAL_SERVICE_KEY}
      Grpc__Clients__Config__Address: ${CONFIG_GRPC_URL:-http://config-api:8081}
      Integrations__Pricing__BaseUrl: ${PRICING_HTTP_URL:-http://pricing-api:8080}
      Integrations__AuditLogs__BaseUrl: ${AUDITLOGS_HTTP_URL:-http://auditlogs-api:8080}
      Integrations__Notifications__BaseUrl: ${NOTIFICATIONS_HTTP_URL:-http://notifications-api:8080}
      Integrations__Storage__BaseUrl: ${STORAGE_HTTP_URL:-http://storage-api:5207}
    networks:
      - dhole-runtime


networks:
  dhole-runtime:
    external: true
    name: ${DHOLE_NETWORK:-dhole}

volumes:
  agent-browser-profiles:
  agent-data-protection-keys:

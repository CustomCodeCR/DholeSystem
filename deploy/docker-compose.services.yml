x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - dhole
  env_file:
    - /opt/dhole/.env

services:
  auth-api:
    <<: *service-defaults
    image: dhole/auth-api:latest

  auth-workers:
    <<: *service-defaults
    image: dhole/auth-workers:latest

  config-api:
    <<: *service-defaults
    image: dhole/config-api:latest

  config-workers:
    <<: *service-defaults
    image: dhole/config-workers:latest

  auditlogs-api:
    <<: *service-defaults
    image: dhole/auditlogs-api:latest

  auditlogs-workers:
    <<: *service-defaults
    image: dhole/auditlogs-workers:latest

  dataextraction-api:
    <<: *service-defaults
    image: dhole/dataextraction-api:latest

  dataextraction-workers:
    <<: *service-defaults
    image: dhole/dataextraction-workers:latest

  pricing-api:
    <<: *service-defaults
    image: dhole/pricing-api:latest

  pricing-workers:
    <<: *service-defaults
    image: dhole/pricing-workers:latest

  ai-api:
    <<: *service-defaults
    image: dhole/ai-api:latest

  ai-workers:
    <<: *service-defaults
    image: dhole/ai-workers:latest

  storage-api:
    <<: *service-defaults
    image: dhole/storage-api:latest

  storage-workers:
    <<: *service-defaults
    image: dhole/storage-workers:latest

  reports-api:
    <<: *service-defaults
    image: dhole/reports-api:latest

  reports-workers:
    <<: *service-defaults
    image: dhole/reports-workers:latest

  notifications-api:
    <<: *service-defaults
    image: dhole/notifications-api:latest

  notifications-workers:
    <<: *service-defaults
    image: dhole/notifications-workers:latest

  api-gateway:
    <<: *service-defaults
    image: dhole/api-gateway:latest

  dhole-web:
    <<: *service-defaults
    image: dhole/web:latest

networks:
  dhole:
    external: true

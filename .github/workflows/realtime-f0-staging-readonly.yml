name: Realtime F0 live staging audit (read-only)
on:
  push:
    branches: [feature/dhole-realtime-universal-rt-20261107-01]
    paths:
      - '.github/workflows/realtime-f0-staging-readonly.yml'
      - 'scripts/realtime/collect-staging-baseline.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rt-20261107-01-f0-staging-audit
  cancel-in-progress: false
jobs:
  read-only-staging:
    # Existing staging infrastructure runner; never deploy or write to production.
    runs-on: [self-hosted, linux, x64, dhole]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Assert fixed release branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "feature/dhole-realtime-universal-rt-20261107-01" ]]
          mkdir -p F0Results
      - name: Inspect staging topology without secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone
          def query(project):
              p = subprocess.run(
                  ["docker","ps","--filter",f"label=com.docker.compose.project={project}",
                   "--format",'{{.Label "com.docker.compose.service"}}'],
                  capture_output=True,text=True,check=True,timeout=15)
              names = sorted(set(v.strip() for v in p.stdout.splitlines() if v.strip()))
              return {"project":project,"runningServiceNames":names,"count":len(names)}
          report={"releaseId":"rt-20261107-01","environment":"staging",
                  "collectedAtUtc":datetime.now(timezone.utc).isoformat(),
                  "readOnly":True,"prodDeployment":False,
                  "projects":[query("dhole-staging"),query("dhole-staging-infra")]}
          with open("F0Results/staging-topology.json","w") as f:
              json.dump(report,f,indent=2)
          print("STAGING_TOPOLOGY_READ_ONLY:",[(p["project"],p["count"]) for p in report["projects"]])
          PY
      - name: Verify authoritative HTTPS staging health baseline
        shell: bash
        run: |
          set -euo pipefail
          test -r /opt/dhole/.env.staging || { echo "STAGING_ENV_ACCESS_MISSING"; exit 1; }
          api_host="$(python3 - <<'PY'
          from pathlib import Path
          entries={}
          for line in Path("/opt/dhole/.env.staging").read_text().splitlines():
              if "=" not in line or line.strip().startswith("#"): continue
              key,value=line.split("=",1)
              entries[key.strip()]=value.strip().strip("'\"")
          print(entries.get("DHOLE_API_HOST",""))
          PY
          )"
          [[ "$api_host" =~ ^[A-Za-z0-9.-]+$ && "$api_host" == *staging* ]] || {
            echo "STAGING_PUBLIC_HOST_NOT_CONFIRMED; refusing to call a potentially production endpoint"
            exit 2
          }
          export DHOLE_GATE_ENV=staging
          export DHOLE_GATE_STAGING_URL="https://$api_host"
          python3 scripts/realtime/collect-staging-baseline.py \
            --samples 100 --output F0Results/staging-https-baseline.json
      - name: Retain read-only evidence (not a deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rt-20261107-01-f0-runtime-readonly
          path: F0Results/*.json
          if-no-files-found: warn

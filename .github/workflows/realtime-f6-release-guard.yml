name: Realtime F6 candidate service registry and batch safety (no deployment)
on:
  push:
    branches: [feature/dhole-realtime-universal-rt-20261107-01]
    paths:
      - 'scripts/realtime/verify-f6-candidate.py'
      - 'scripts/realtime/verify-f6-formal-gate.py'
      - 'docs/realtime/gate-evidence.f6.yaml'
      - 'docs/realtime/F6-CANDIDATE-COVERAGE-20261108.md'
      - 'docs/realtime/release-manifest.yaml'
      - 'docs/realtime/service-registry.yaml'
      - 'docs/realtime/coverage-matrix.csv'
      - 'deploy/docker-compose.services.yml'
      - 'version.json'
      - '.github/workflows/realtime-f6-release-guard.yml'
  pull_request:
    branches: [develop, master]
    paths:
      - 'docs/realtime/**'
      - 'scripts/realtime/**'
      - 'deploy/docker-compose.services.yml'
      - 'version.json'
      - '.github/workflows/realtime-f6-release-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  f6-candidate-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate Python script syntax
        run: python -m py_compile scripts/realtime/verify-f6-candidate.py scripts/realtime/verify-f6-formal-gate.py
      - name: Enforce branch and flags policy
        if: github.event_name != 'pull_request'
        run: python scripts/realtime/verify-branch-policy.py
      - name: Validate 17 repo manifest and F6 service versioning
        if: github.event_name != 'pull_request'
        run: python scripts/realtime/verify-f6-candidate.py
      - name: Ensure all sequential phase gates remain fail-closed
        if: github.event_name != 'pull_request'
        run: python scripts/realtime/verify-f0-f4-gates.py --assert-blocked
      - name: Prove F6 candidate cannot authorize F7
        if: github.event_name != 'pull_request'
        run: python scripts/realtime/verify-f6-formal-gate.py --assert-blocked
      - name: Prevent premature batch merge until formal F6 approval
        if: github.event_name == 'pull_request'
        run: python scripts/realtime/verify-f6-formal-gate.py --require-all

name: Deploy Dhole Infrastructure - Production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dhole-infrastructure-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]

    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Install deployment files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /opt/dhole
          cp deploy/docker-compose.services.yml /opt/dhole/docker-compose.services.yml
          cp deploy/docker-compose.staging-infra.yml /opt/dhole/docker-compose.staging-infra.yml
          bash deploy/prepare-environments.sh /opt/dhole/.env /opt/dhole

      - name: Validate production environment
        shell: bash
        env:
          DHOLE_ENV_FILE: /opt/dhole/.env.production
          DHOLE_IMAGE_TAG: latest
          DHOLE_NETWORK: dhole
        run: |
          set -euo pipefail
          docker version
          docker compose version
          docker network inspect dhole >/dev/null
          test -r "$DHOLE_ENV_FILE"
          docker compose --env-file "$DHOLE_ENV_FILE" -f /opt/dhole/docker-compose.services.yml -p dhole config -q

      - name: Keep DholeSystem feature branches clean
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          while IFS= read -r branch; do
            case "$branch" in
              master|develop|main) continue ;;
            esac
            echo "Deleting obsolete branch: $branch"
            git push origin --delete "$branch"
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -v '^HEAD$' || true)

      - name: Show environment routing
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^(ASPNETCORE_ENVIRONMENT|DHOLE_WEB_HOST|DHOLE_API_HOST|DHOLE_WEB_PUBLIC_URL|DHOLE_API_PUBLIC_URL|VITE_API_URL|VITE_FRONTEND_DOMAIN|CORS_WEB_ORIGIN)=' /opt/dhole/.env.production

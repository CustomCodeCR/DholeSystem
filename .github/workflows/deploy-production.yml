name: Deploy Dhole Infrastructure - Production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dhole-infrastructure-production
  cancel-in-progress: false

env:
  DHOLE_IMAGE_TAG: latest
  DHOLE_NETWORK: dhole
  COMPOSE_PROJECT: dhole

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]

    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Prepare runtime environments
        shell: bash
        run: |
          set -euo pipefail
          ENV_DIR="$RUNNER_TEMP/dhole-env"
          mkdir -p "$ENV_DIR"
          bash deploy/prepare-environments.sh /opt/dhole/.env "$ENV_DIR"
          echo "DHOLE_ENV_FILE=$ENV_DIR/.env.production" >> "$GITHUB_ENV"

      - name: Bootstrap production databases, Ollama and Traefik
        shell: bash
        run: |
          set -euo pipefail

          read_env() {
            local key="$1"
            grep -m1 "^${key}=" "$DHOLE_ENV_FILE" | cut -d= -f2- | tr -d '\r'
          }

          POSTGRES_USER="$(read_env POSTGRES_USER)"
          POSTGRES_PASSWORD="$(read_env POSTGRES_PASSWORD)"
          MONGO_USER="$(read_env MONGO_USER)"
          MONGO_PASSWORD="$(read_env MONGO_PASSWORD)"

          for volume in \
            argos_postgres_data \
            argos_mongo_data \
            argos_redis_data \
            dhole-infrastructure_ollama_data \
            dhole-infrastructure_traefik_letsencrypt; do
            docker volume inspect "$volume" >/dev/null || {
              echo "Required persistent volume missing: $volume" >&2
              exit 1
            }
          done

          docker network inspect dhole >/dev/null 2>&1 || docker network create dhole

          docker image inspect postgres:16 >/dev/null 2>&1 || docker pull postgres:16
          docker image inspect mongo:7 >/dev/null 2>&1 || docker pull mongo:7
          docker image inspect redis:7-alpine >/dev/null 2>&1 || docker pull redis:7-alpine
          docker image inspect ollama/ollama:latest >/dev/null 2>&1 || docker pull ollama/ollama:latest
          docker image inspect traefik:v3 >/dev/null 2>&1 || docker pull traefik:v3

          docker rm -f postgres mongo redis ollama traefik 2>/dev/null || true

          docker run -d --name postgres --restart unless-stopped --network dhole \
            -e POSTGRES_USER="$POSTGRES_USER" \
            -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            -e TZ=America/Costa_Rica \
            -v argos_postgres_data:/var/lib/postgresql/data \
            postgres:16

          docker run -d --name mongo --restart unless-stopped --network dhole \
            -e MONGO_INITDB_ROOT_USERNAME="$MONGO_USER" \
            -e MONGO_INITDB_ROOT_PASSWORD="$MONGO_PASSWORD" \
            -e TZ=America/Costa_Rica \
            -v argos_mongo_data:/data/db \
            mongo:7

          docker run -d --name redis --restart unless-stopped --network dhole \
            -e TZ=America/Costa_Rica \
            -v argos_redis_data:/data \
            redis:7-alpine

          docker run -d --name ollama --restart unless-stopped --network dhole \
            -p 127.0.0.1:11434:11434 \
            -e TZ=America/Costa_Rica \
            -e OLLAMA_KEEP_ALIVE=30m \
            -e OLLAMA_CONTEXT_LENGTH=65536 \
            -v dhole-infrastructure_ollama_data:/root/.ollama \
            ollama/ollama:latest

          docker run -d --name traefik --restart unless-stopped --network dhole \
            -p 127.0.0.1:80:80 \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v dhole-infrastructure_traefik_letsencrypt:/letsencrypt \
            --label traefik.enable=true \
            --label 'traefik.http.routers.traefik.rule=Host(`traefik.customcodecr.com`)' \
            --label traefik.http.routers.traefik.entrypoints=web \
            --label traefik.http.routers.traefik.service=api@internal \
            traefik:v3 \
            --providers.docker=true \
            --providers.docker.exposedbydefault=false \
            --providers.docker.network=dhole \
            --entrypoints.web.address=:80 \
            --api.dashboard=true \
            --log.level=INFO \
            --accesslog=true

          for attempt in $(seq 1 30); do
            if docker exec postgres pg_isready -U "$POSTGRES_USER" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          docker exec postgres pg_isready -U "$POSTGRES_USER"
          docker exec redis redis-cli ping | grep -q PONG
          docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1
          curl -fsS --max-time 10 http://127.0.0.1:11434/api/tags >/dev/null
      - name: Resolve persistent MinIO volume
        shell: bash
        run: |
          set -euo pipefail
          read_env() {
            local key="$1"
            grep -m1 "^${key}=" "$DHOLE_ENV_FILE" | cut -d= -f2- | tr -d '\r' || true
          }

          configured_volume="$(read_env MINIO_VOLUME_NAME)"
          selected_volume=""
          candidates=()
          if [[ -n "$configured_volume" ]]; then
            candidates+=("$configured_volume")
          fi
          candidates+=(
            "dhole-infrastructure_minio_data"
            "minio_data"
            "dhole_minio_data"
          )

          for candidate in "${candidates[@]}"; do
            if docker volume inspect "$candidate" >/dev/null 2>&1; then
              selected_volume="$candidate"
              break
            fi
          done

          if [[ -z "$selected_volume" ]]; then
            echo "No se encontró un volumen persistente existente para MinIO." >&2
            echo "Candidatos revisados: ${candidates[*]}" >&2
            echo "Se cancela el deploy para evitar crear un MinIO vacío." >&2
            exit 1
          fi

          echo "MINIO_VOLUME_NAME=$selected_volume" >> "$GITHUB_ENV"
          echo "MinIO production volume: $selected_volume"
      - name: Ensure production network and local Ollama
        shell: bash
        run: |
          set -euo pipefail
          docker network inspect dhole >/dev/null 2>&1 || docker network create dhole
          OLLAMA_ID="$(docker ps -q --filter name=^/ollama$ | head -n1 || true)"
          if [[ -z "$OLLAMA_ID" ]]; then
            OLLAMA_ID="$(docker ps -q --filter label=com.docker.compose.service=ollama | head -n1 || true)"
          fi
          if [[ -z "$OLLAMA_ID" ]]; then
            echo "Ollama container not found. Hermes must use local Ollama." >&2
            exit 1
          fi
          docker network connect --alias ollama dhole "$OLLAMA_ID" 2>/dev/null || true

      - name: Start production MinIO with persistent data
        shell: bash
        run: |
          set -euo pipefail
          docker volume inspect "$MINIO_VOLUME_NAME" >/dev/null

          # Recovery path: Docker Hub and anonymous Quay pulls for MinIO
          # are unavailable. Build the last Community Edition locally from the
          # official MinIO binary archive, without touching the persistent data.
          MINIO_IMAGE="dhole/minio:community-2025-09-07"
          MINIO_RELEASE="RELEASE.2025-09-07T16-13-09Z"
          if ! docker image inspect "$MINIO_IMAGE" >/dev/null 2>&1; then
            MINIO_BUILD_DIR="$(mktemp -d)"
            trap 'rm -rf "$MINIO_BUILD_DIR"' EXIT
            curl -fL --retry 5 --retry-delay 2 \
              "https://dl.min.io/community/server/minio/release/linux-amd64/archive/minio.$MINIO_RELEASE" \
              -o "$MINIO_BUILD_DIR/minio.$MINIO_RELEASE"
            curl -fL --retry 5 --retry-delay 2 \
              "https://dl.min.io/community/server/minio/release/linux-amd64/archive/minio.$MINIO_RELEASE.sha256sum" \
              -o "$MINIO_BUILD_DIR/minio.$MINIO_RELEASE.sha256sum"
            (
              cd "$MINIO_BUILD_DIR"
              sha256sum -c "minio.$MINIO_RELEASE.sha256sum"
              mv "minio.$MINIO_RELEASE" minio
              chmod 0755 minio
              printf '%s\n' \
                'FROM alpine:3.20' \
                'COPY minio /usr/local/bin/minio' \
                'ENTRYPOINT ["/usr/local/bin/minio"]' \
                > Dockerfile
              docker image inspect alpine:3.20 >/dev/null 2>&1 || docker pull alpine:3.20
              docker build --pull=false -t "$MINIO_IMAGE" .
            )
          fi
          docker image inspect "$MINIO_IMAGE" >/dev/null

          docker compose --env-file "$DHOLE_ENV_FILE" -f deploy/docker-compose.infrastructure.yml -p dhole-infrastructure up -d --pull never minio

          MINIO_ID="$(docker compose --env-file "$DHOLE_ENV_FILE" -f deploy/docker-compose.infrastructure.yml -p dhole-infrastructure ps -q minio)"
          test -n "$MINIO_ID"

          mounted_volume="$(docker inspect "$MINIO_ID" --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}')"
          if [[ "$mounted_volume" != "$MINIO_VOLUME_NAME" ]]; then
            echo "MinIO montó '$mounted_volume' pero se esperaba '$MINIO_VOLUME_NAME'." >&2
            exit 1
          fi

          echo "MinIO usa el volumen persistente: $mounted_volume"
      - name: Start production Hermes with Chromium
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect alpine:3.20 >/dev/null 2>&1 || docker pull alpine:3.20
          docker build --pull -f deploy/hermes/Dockerfile -t dhole/hermes-agent:latest .
          docker compose --env-file "$DHOLE_ENV_FILE" -f deploy/docker-compose.infrastructure.yml -p dhole-infrastructure up -d --pull never hermes-config-init hermes-agent
          HERMES_ID="$(docker compose --env-file "$DHOLE_ENV_FILE" -f deploy/docker-compose.infrastructure.yml -p dhole-infrastructure ps -q hermes-agent)"
          test -n "$HERMES_ID"
          for attempt in $(seq 1 30); do
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$HERMES_ID" 2>/dev/null || true)"
            if [[ "$health" = "healthy" ]]; then break; fi
            if [[ "$health" = "unhealthy" || "$health" = "exited" || "$health" = "dead" ]]; then
              docker logs --tail 200 "$HERMES_ID" || true
              exit 1
            fi
            sleep 4
          done
          if [[ "$(docker inspect -f '{{.State.Health.Status}}' "$HERMES_ID" 2>/dev/null || true)" != "healthy" ]]; then
            docker logs --tail 200 "$HERMES_ID" || true
            exit 1
          fi
          docker exec "$HERMES_ID" curl -fsS http://ollama:11434/v1/models >/dev/null
          docker exec "$HERMES_ID" test -x /usr/bin/chromium

      - name: Validate production environment and services
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
          test -r "$DHOLE_ENV_FILE"
          docker compose --env-file "$DHOLE_ENV_FILE" -f deploy/docker-compose.services.yml -p "$COMPOSE_PROJECT" config -q
          services="$(docker compose --env-file "$DHOLE_ENV_FILE" -f deploy/docker-compose.services.yml -p "$COMPOSE_PROJECT" config --services)"
          for service in content-api content-workers dhole-agent-api dhole-agent-workers api-gateway; do
            grep -qx "$service" <<<"$services" || { echo "Missing production service: $service" >&2; exit 1; }
          done

      - name: Verify Hermes production API
        shell: bash
        run: curl -fsS --max-time 10 http://127.0.0.1:8642/health >/dev/null

      - name: Keep DholeSystem feature branches clean
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          while IFS= read -r branch; do
            case "$branch" in
              master|develop|main) continue ;;
            esac
            echo "Deleting obsolete branch: $branch"
            git push origin --delete "$branch"
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -v '^HEAD$' || true)

      - name: Show environment routing
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^(ASPNETCORE_ENVIRONMENT|DHOLE_WEB_HOST|DHOLE_API_HOST|DHOLE_WEB_PUBLIC_URL|DHOLE_API_PUBLIC_URL|VITE_API_URL|VITE_FRONTEND_DOMAIN|CORS_WEB_ORIGIN|HERMES_API_SERVER_MODEL_NAME)=' "$DHOLE_ENV_FILE" || true

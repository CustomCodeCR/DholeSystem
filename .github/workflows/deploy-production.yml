name: Deploy Dhole Infrastructure - Production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dhole-infrastructure-production
  cancel-in-progress: false

env:
  DHOLE_IMAGE_TAG: latest
  DHOLE_NETWORK: dhole
  COMPOSE_PROJECT: dhole

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]

    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Prepare runtime environments
        shell: bash
        run: |
          set -euo pipefail
          ENV_DIR="$RUNNER_TEMP/dhole-env"
          mkdir -p "$ENV_DIR"
          bash deploy/prepare-environments.sh /opt/dhole/.env "$ENV_DIR"
          echo "DHOLE_ENV_FILE=$ENV_DIR/.env.production" >> "$GITHUB_ENV"

      - name: Resolve persistent MinIO volume
        shell: bash
        run: |
          set -euo pipefail
          read_env() {
            local key="$1"
            grep -m1 "^${key}=" "$DHOLE_ENV_FILE" | cut -d= -f2- | tr -d '\r' || true
          }

          configured_volume="$(read_env MINIO_VOLUME_NAME)"
          selected_volume=""
          candidates=()
          if [[ -n "$configured_volume" ]]; then
            candidates+=("$configured_volume")
          fi
          candidates+=(
            "dhole-infrastructure_minio_data"
            "minio_data"
            "dhole_minio_data"
          )

          for candidate in "${candidates[@]}"; do
            if docker volume inspect "$candidate" >/dev/null 2>&1; then
              selected_volume="$candidate"
              break
            fi
          done

          if [[ -z "$selected_volume" ]]; then
            echo "No se encontró un volumen persistente existente para MinIO." >&2
            echo "Candidatos revisados: ${candidates[*]}" >&2
            echo "Se cancela el deploy para evitar crear un MinIO vacío." >&2
            exit 1
          fi

          echo "MINIO_VOLUME_NAME=$selected_volume" >> "$GITHUB_ENV"
          echo "MinIO production volume: $selected_volume"
      - name: Ensure production network and local Ollama
        shell: bash
        run: |
          set -euo pipefail
          docker network inspect dhole >/dev/null 2>&1 || docker network create dhole
          OLLAMA_ID="$(docker ps -q --filter name=^/ollama$ | head -n1 || true)"
          if [[ -z "$OLLAMA_ID" ]]; then
            OLLAMA_ID="$(docker ps -q --filter label=com.docker.compose.service=ollama | head -n1 || true)"
          fi
          if [[ -z "$OLLAMA_ID" ]]; then
            echo "Ollama container not found. Hermes must use local Ollama." >&2
            exit 1
          fi
          docker network connect --alias ollama dhole "$OLLAMA_ID" 2>/dev/null || true

      - name: Start production MinIO with persistent data
        shell: bash
        run: |
          set -euo pipefail
          docker volume inspect "$MINIO_VOLUME_NAME" >/dev/null

          # minio-init uses the MinIO client image. The runner may not have it
          # cached, while --pull never intentionally prevents Compose from
          # downloading anything during the actual MinIO start.
          docker image inspect quay.io/minio/mc:latest >/dev/null 2>&1 || docker pull quay.io/minio/mc:latest

          docker compose --env-file "$DHOLE_ENV_FILE" -f deploy/docker-compose.infrastructure.yml -p dhole-infrastructure up -d --pull never minio minio-init

          MINIO_ID="$(docker compose --env-file "$DHOLE_ENV_FILE" -f deploy/docker-compose.infrastructure.yml -p dhole-infrastructure ps -q minio)"
          test -n "$MINIO_ID"

          mounted_volume="$(docker inspect "$MINIO_ID" --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}')"
          if [[ "$mounted_volume" != "$MINIO_VOLUME_NAME" ]]; then
            echo "MinIO montó '$mounted_volume' pero se esperaba '$MINIO_VOLUME_NAME'." >&2
            exit 1
          fi

          echo "MinIO usa el volumen persistente: $mounted_volume"
      - name: Start production Hermes with Chromium
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect alpine:3.20 >/dev/null 2>&1 || docker pull alpine:3.20
          docker build --pull -f deploy/hermes/Dockerfile -t dhole/hermes-agent:latest .
          docker compose --env-file "$DHOLE_ENV_FILE" -f deploy/docker-compose.infrastructure.yml -p dhole-infrastructure up -d --pull never hermes-config-init hermes-agent
          HERMES_ID="$(docker compose --env-file "$DHOLE_ENV_FILE" -f deploy/docker-compose.infrastructure.yml -p dhole-infrastructure ps -q hermes-agent)"
          test -n "$HERMES_ID"
          for attempt in $(seq 1 30); do
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$HERMES_ID" 2>/dev/null || true)"
            if [[ "$health" = "healthy" ]]; then break; fi
            if [[ "$health" = "unhealthy" || "$health" = "exited" || "$health" = "dead" ]]; then
              docker logs --tail 200 "$HERMES_ID" || true
              exit 1
            fi
            sleep 4
          done
          if [[ "$(docker inspect -f '{{.State.Health.Status}}' "$HERMES_ID" 2>/dev/null || true)" != "healthy" ]]; then
            docker logs --tail 200 "$HERMES_ID" || true
            exit 1
          fi
          docker exec "$HERMES_ID" curl -fsS http://ollama:11434/v1/models >/dev/null
          docker exec "$HERMES_ID" test -x /usr/bin/chromium

      - name: Validate production environment and services
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
          test -r "$DHOLE_ENV_FILE"
          docker compose --env-file "$DHOLE_ENV_FILE" -f deploy/docker-compose.services.yml -p "$COMPOSE_PROJECT" config -q
          services="$(docker compose --env-file "$DHOLE_ENV_FILE" -f deploy/docker-compose.services.yml -p "$COMPOSE_PROJECT" config --services)"
          for service in content-api content-workers dhole-agent-api dhole-agent-workers api-gateway; do
            grep -qx "$service" <<<"$services" || { echo "Missing production service: $service" >&2; exit 1; }
          done

      - name: Verify Hermes production API
        shell: bash
        run: curl -fsS --max-time 10 http://127.0.0.1:8642/health >/dev/null

      - name: Keep DholeSystem feature branches clean
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          while IFS= read -r branch; do
            case "$branch" in
              master|develop|main) continue ;;
            esac
            echo "Deleting obsolete branch: $branch"
            git push origin --delete "$branch"
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -v '^HEAD$' || true)

      - name: Show environment routing
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^(ASPNETCORE_ENVIRONMENT|DHOLE_WEB_HOST|DHOLE_API_HOST|DHOLE_WEB_PUBLIC_URL|DHOLE_API_PUBLIC_URL|VITE_API_URL|VITE_FRONTEND_DOMAIN|CORS_WEB_ORIGIN|HERMES_API_SERVER_MODEL_NAME)=' "$DHOLE_ENV_FILE" || true

name: Deploy Dhole Infrastructure - Production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dhole-infrastructure-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]

    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Use server production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -r /opt/dhole/.env
          test -r /opt/dhole/docker-compose.services.yml
          echo "DHOLE_ENV_FILE=/opt/dhole/.env" >> "$GITHUB_ENV"
          echo "COMPOSE_FILE=/opt/dhole/docker-compose.services.yml" >> "$GITHUB_ENV"

      - name: Validate production compose
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
          docker network inspect dhole >/dev/null
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p dhole config -q

      - name: Verify production containers and local Traefik routes
        shell: bash
        run: |
          set -euo pipefail

          read_env() {
            local key="$1"
            grep -m1 "^${key}=" "$DHOLE_ENV_FILE" | cut -d= -f2- | tr -d '\r'
          }

          DHOLE_WEB_HOST="$(read_env DHOLE_WEB_HOST)"
          DHOLE_API_HOST="$(read_env DHOLE_API_HOST)"
          FENNEC_HOST="$(read_env FENNEC_HOST)"
          FENNEC_WWW_HOST="$(read_env FENNEC_WWW_HOST)"

          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p dhole ps dhole-web api-gateway website

          for host in "$DHOLE_WEB_HOST" "$DHOLE_API_HOST" "$FENNEC_HOST" "$FENNEC_WWW_HOST"; do
            echo "Testing local Traefik health route for $host"
            code="$(curl -sS -o /tmp/prod-route-body -w '%{http_code}' -H "Host: $host" http://127.0.0.1/health || true)"
            echo "$host/health -> HTTP $code"
          done

      - name: Diagnose public DNS and Cloudflare tunnel
        shell: bash
        run: |
          set -euo pipefail

          for host in logisticacastrofallas.com www.logisticacastrofallas.com sistema.logisticacastrofallas.com api.logisticacastrofallas.com; do
            echo "=== DNS $host ==="
            getent ahostsv4 "$host" | head -n3 || true
          done

          echo "=== cloudflared service ==="
          systemctl is-active cloudflared 2>/dev/null || true
          command -v cloudflared || true
          cloudflared --version 2>/dev/null || true

          echo "=== non-secret cloudflared ingress ==="
          if [[ -r /etc/cloudflared/config.yml ]]; then
            grep -E '^([[:space:]]*tunnel:|[[:space:]]*-?[[:space:]]*hostname:|[[:space:]]*service:)' /etc/cloudflared/config.yml || true
          elif [[ -r /etc/cloudflared/config.yaml ]]; then
            grep -E '^([[:space:]]*tunnel:|[[:space:]]*-?[[:space:]]*hostname:|[[:space:]]*service:)' /etc/cloudflared/config.yaml || true
          else
            echo "No readable /etc/cloudflared/config.yml found"
          fi

      - name: Keep DholeSystem feature branches clean
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          while IFS= read -r branch; do
            case "$branch" in
              master|develop|main) continue ;;
            esac
            echo "Deleting obsolete branch: $branch"
            git push origin --delete "$branch"
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -v '^HEAD$' || true)

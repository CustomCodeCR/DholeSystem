name: Reset production Pricing transactional data

on:
  push:
    branches: [ops-production-data-audit]
    paths:
      - '.github/scripts/reset-production-pricing.sh'
      - '.github/workflows/reset-production-pricing.yml'

permissions:
  contents: read

jobs:
  reset-pricing:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
      - name: Backup and truncate production Pricing transactional tables
        shell: bash
        run: bash .github/scripts/reset-production-pricing.sh

name: Realtime F0-F4 fail-closed gate audit (no deployment)
on:
  push:
    branches: [feature/dhole-realtime-universal-rt-20261107-01]
    paths:
      - 'scripts/realtime/verify-f0-f4-gates.py'
      - 'docs/realtime/gate-evidence.f0-f4.yaml'
      - '.github/workflows/realtime-f0-f4-gate-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Enforce branch/flag immutability
        run: python scripts/realtime/verify-branch-policy.py
      - name: Compute phase status without asserting fake approvals
        run: python scripts/realtime/verify-f0-f4-gates.py --report-only
      - name: Prove pending criteria block an early release
        run: python scripts/realtime/verify-f0-f4-gates.py --assert-blocked
      - name: Upload explicit blocker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rt-20261107-01-f0-f4-gate-blockers
          path: GateResults/F0-F4-gates.json
          if-no-files-found: error

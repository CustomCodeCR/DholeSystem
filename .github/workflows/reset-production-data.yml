name: Backup and reset production transactional data

on:
  push:
    branches: [ops-production-data-audit]
    paths:
      - '.github/workflows/reset-production-data.yml'

permissions:
  contents: read

jobs:
  reset:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4

      - name: Backup and reset PostgreSQL production data
        shell: bash
        run: |
          set -euo pipefail

          PG_CONTAINER=postgres
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup_dir="/opt/dhole/backups/data-reset-${timestamp}"
          mkdir -p "$backup_dir"
          chmod 700 "$backup_dir"

          psql_db() {
            local db="$1"; shift
            docker exec "$PG_CONTAINER" sh -lc 'PGPASSWORD="${POSTGRES_PASSWORD:-}" psql -v ON_ERROR_STOP=1 -U "${POSTGRES_USER:-postgres}" -d "$1" "$@"' sh "$db" "$@"
          }

          query_tables() {
            local db="$1"
            docker exec "$PG_CONTAINER" sh -lc 'PGPASSWORD="${POSTGRES_PASSWORD:-}" psql -U "${POSTGRES_USER:-postgres}" -d "$1" -At -c "SELECT schemaname || CHR(46) || relname FROM pg_stat_user_tables ORDER BY schemaname, relname;"' sh "$db"
          }

          check_exact_tables() {
            local db="$1"
            local expected="$2"
            local actual_file expected_file
            actual_file="$(mktemp)"
            expected_file="$(mktemp)"
            query_tables "$db" | sort > "$actual_file"
            printf '%s\n' "$expected" | sed '/^[[:space:]]*$/d' | sort > "$expected_file"
            if ! diff -u "$expected_file" "$actual_file"; then
              echo "ERROR: table inventory for $db differs from the reviewed whitelist. No data has been deleted."
              rm -f "$actual_file" "$expected_file"
              exit 1
            fi
            rm -f "$actual_file" "$expected_file"
          }

          echo '=== Verify reviewed table inventory before any mutation ==='
          check_exact_tables dhole_ai "
          ai.AiConnections
          ai.AiEmailAnalysisJobs
          ai.AiExecutionAttempts
          ai.AiExecutions
          ai.AiModels
          ai.AiProfileModels
          ai.AiProfiles
          ai.AiPromptTemplates
          ai.inbox_messages
          ai.outbox_messages
          public.__EFMigrationsHistory"

          check_exact_tables dhole_auditlogs "
          auditlogs.AuditEvents
          auditlogs.inbox_messages
          public.__EFMigrationsHistory"

          check_exact_tables dhole_auth "
          auth.RoleScopes
          auth.Roles
          auth.Scopes
          auth.Sessions
          auth.UserRoles
          auth.UserScopes
          auth.Users
          auth.inbox_messages
          auth.outbox_messages
          public.__EFMigrationsHistory"

          check_exact_tables dhole_config "
          config.CatalogGroups
          config.CatalogItems
          config.inbox_messages
          config.outbox_messages
          public.__EFMigrationsHistory"

          check_exact_tables dhole_data_extraction "
          data_extraction.ColumnMappingProfiles
          data_extraction.ColumnMappingRules
          data_extraction.EmailAiAnalysisRequests
          data_extraction.EmailAttachments
          data_extraction.EmailExtractionJobs
          data_extraction.EmailIngestionAccounts
          data_extraction.EmailMessages
          data_extraction.ExtractionExecutions
          data_extraction.ExtractionIssues
          data_extraction.PricingExtractionRecords
          data_extraction.SourceDocuments
          data_extraction.inbox_messages
          data_extraction.outbox_messages
          public.__EFMigrationsHistory"

          check_exact_tables dhole_notifications "
          notifications.inbox_messages
          notifications.notification_delivery_attempts
          notifications.notification_messages
          notifications.notification_recipients
          notifications.notification_templates
          notifications.outbox_messages"

          check_exact_tables dhole_pricing "
          pricing.CarrierFreeDayRules
          pricing.CostIncoterms
          pricing.CostServices
          pricing.Costs
          pricing.ImportFclRates
          pricing.LclRateSources
          pricing.LogisticsNews
          pricing.LogisticsNewsRateImpacts
          pricing.OwnLclConsolidationPricingLines
          pricing.OwnLclConsolidations
          pricing.OwnLclHistoricalRates
          pricing.PricingImportFromExtractionJobs
          pricing.RateComparisonDetails
          pricing.RateComparisons
          pricing.RateContainerAllocations
          pricing.RateDetails
          pricing.RateHeaders
          pricing.RateRequests
          pricing.RateRevisions
          pricing.RateServices
          pricing.RateTermBlockItems
          pricing.RateTermBlockServices
          pricing.RateTermBlocks
          pricing.RateTermItems
          pricing.inbox_messages
          pricing.outbox_messages
          public.__EFMigrationsHistory"

          check_exact_tables dhole_reports "
          public.__EFMigrationsHistory
          reports.report_templates"

          check_exact_tables dhole_storage "
          public.__EFMigrationsHistory
          storage.FileReferences
          storage.FileVersions
          storage.Files
          storage.StorageProviders
          storage.inbox_messages
          storage.outbox_messages"

          echo '=== Pause Dhole application containers for a consistent backup/reset point ==='
          mapfile -t app_containers < <(docker network inspect dhole --format '{{range .Containers}}{{.Name}}{{"\n"}}{{end}}' | grep -E '^dhole-(ai|api-gateway|auditlogs|auth|config|dataextraction|dhole-web|notifications|pricing|reports|storage)-' | sort)
          paused=()
          cleanup_pause() {
            if [ "${#paused[@]}" -gt 0 ]; then
              docker unpause "${paused[@]}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_pause EXIT
          for c in "${app_containers[@]}"; do
            [ -n "$c" ] || continue
            docker pause "$c" >/dev/null
            paused+=("$c")
          done
          echo "PAUSED_CONTAINERS=${#paused[@]}"

          echo '=== Create full compressed backups before reset ==='
          dbs=(dhole_ai dhole_auditlogs dhole_auth dhole_config dhole_data_extraction dhole_notifications dhole_pricing dhole_reports dhole_storage)
          for db in "${dbs[@]}"; do
            file="$backup_dir/${db}.dump"
            docker exec "$PG_CONTAINER" sh -lc 'PGPASSWORD="${POSTGRES_PASSWORD:-}" pg_dump -U "${POSTGRES_USER:-postgres}" -Fc --no-owner --no-privileges "$1"' sh "$db" > "$file"
            test -s "$file"
            pg_restore -l "$file" >/dev/null
            echo "BACKUP_OK|$db|$(stat -c%s "$file")"
          done
          sha256sum "$backup_dir"/*.dump > "$backup_dir/SHA256SUMS"
          chmod 600 "$backup_dir"/*
          echo "BACKUP_DIR=$backup_dir"

          echo '=== Row counts retained before reset ==='
          for spec in \
            'dhole_auth|auth.Users' \
            'dhole_auth|auth.Roles' \
            'dhole_auth|auth.Scopes' \
            'dhole_config|config.CatalogGroups' \
            'dhole_config|config.CatalogItems' \
            'dhole_ai|ai.AiConnections' \
            'dhole_ai|ai.AiModels' \
            'dhole_ai|ai.AiProfiles' \
            'dhole_ai|ai.AiProfileModels' \
            'dhole_ai|ai.AiPromptTemplates' \
            'dhole_pricing|pricing.ImportFclRates' \
            'dhole_pricing|pricing.Costs' \
            'dhole_pricing|pricing.RateTermItems' \
            'dhole_pricing|pricing.RateTermBlocks' \
            'dhole_pricing|pricing.OwnLclHistoricalRates' \
            'dhole_reports|reports.report_templates' \
            'dhole_storage|storage.Files'; do
            db="${spec%%|*}"; table="${spec#*|}"
            count="$(docker exec "$PG_CONTAINER" sh -lc 'PGPASSWORD="${POSTGRES_PASSWORD:-}" psql -U "${POSTGRES_USER:-postgres}" -d "$1" -At -c "SELECT COUNT(*) FROM $2;"' sh "$db" "$table")"
            echo "KEEP_BEFORE|$db|$table|$count"
          done

          echo '=== Truncate reviewed transactional/history tables (NO CASCADE) ==='
          docker exec "$PG_CONTAINER" sh -lc 'PGPASSWORD="${POSTGRES_PASSWORD:-}" psql -v ON_ERROR_STOP=1 -U "${POSTGRES_USER:-postgres}" -d dhole_ai <<'"'"'SQL'"'"'
BEGIN;
TRUNCATE TABLE
  ai."AiEmailAnalysisJobs",
  ai."AiExecutionAttempts",
  ai."AiExecutions",
  ai.inbox_messages,
  ai.outbox_messages
RESTART IDENTITY;
COMMIT;
SQL'

          docker exec "$PG_CONTAINER" sh -lc 'PGPASSWORD="${POSTGRES_PASSWORD:-}" psql -v ON_ERROR_STOP=1 -U "${POSTGRES_USER:-postgres}" -d dhole_auditlogs <<'"'"'SQL'"'"'
BEGIN;
TRUNCATE TABLE auditlogs."AuditEvents", auditlogs.inbox_messages RESTART IDENTITY;
COMMIT;
SQL'

          docker exec "$PG_CONTAINER" sh -lc 'PGPASSWORD="${POSTGRES_PASSWORD:-}" psql -v ON_ERROR_STOP=1 -U "${POSTGRES_USER:-postgres}" -d dhole_auth <<'"'"'SQL'"'"'
BEGIN;
TRUNCATE TABLE auth."Sessions", auth.inbox_messages, auth.outbox_messages RESTART IDENTITY;
COMMIT;
SQL'

          docker exec "$PG_CONTAINER" sh -lc 'PGPASSWORD="${POSTGRES_PASSWORD:-}" psql -v ON_ERROR_STOP=1 -U "${POSTGRES_USER:-postgres}" -d dhole_config <<'"'"'SQL'"'"'
BEGIN;
TRUNCATE TABLE config.inbox_messages, config.outbox_messages RESTART IDENTITY;
COMMIT;
SQL'

          docker exec "$PG_CONTAINER" sh -lc 'PGPASSWORD="${POSTGRES_PASSWORD:-}" psql -v ON_ERROR_STOP=1 -U "${POSTGRES_USER:-postgres}" -d dhole_data_extraction <<'"'"'SQL'"'"'
BEGIN;
TRUNCATE TABLE
  data_extraction."EmailAiAnalysisRequests",
  data_extraction."EmailExtractionJobs",
  data_extraction."EmailAttachments",
  data_extraction."EmailMessages",
  data_extraction."ExtractionIssues",
  data_extraction."PricingExtractionRecords",
  data_extraction."SourceDocuments",
  data_extraction."ExtractionExecutions",
  data_extraction.inbox_messages,
  data_extraction.outbox_messages
RESTART IDENTITY;
COMMIT;
SQL'

          docker exec "$PG_CONTAINER" sh -lc 'PGPASSWORD="${POSTGRES_PASSWORD:-}" psql -v ON_ERROR_STOP=1 -U "${POSTGRES_USER:-postgres}" -d dhole_notifications <<'"'"'SQL'"'"'
BEGIN;
TRUNCATE TABLE
  notifications.notification_delivery_attempts,
  notifications.notification_recipients,
  notifications.notification_messages,
  notifications.inbox_messages,
  notifications.outbox_messages
RESTART IDENTITY;
COMMIT;
SQL'

          docker exec "$PG_CONTAINER" sh -lc 'PGPASSWORD="${POSTGRES_PASSWORD:-}" psql -v ON_ERROR_STOP=1 -U "${POSTGRES_USER:-postgres}" -d dhole_pricing <<'"'"'SQL'"'"'
BEGIN;
TRUNCATE TABLE
  pricing."RateComparisonDetails",
  pricing."RateComparisons",
  pricing."RateRevisions",
  pricing."RateContainerAllocations",
  pricing."RateDetails",
  pricing."RateServices",
  pricing."RateHeaders",
  pricing."RateRequests",
  pricing."PricingImportFromExtractionJobs",
  pricing."LogisticsNewsRateImpacts",
  pricing."LogisticsNews",
  pricing."OwnLclConsolidationPricingLines",
  pricing."OwnLclConsolidations",
  pricing.inbox_messages,
  pricing.outbox_messages
RESTART IDENTITY;
COMMIT;
SQL'

          docker exec "$PG_CONTAINER" sh -lc 'PGPASSWORD="${POSTGRES_PASSWORD:-}" psql -v ON_ERROR_STOP=1 -U "${POSTGRES_USER:-postgres}" -d dhole_storage <<'"'"'SQL'"'"'
BEGIN;
TRUNCATE TABLE storage.inbox_messages, storage.outbox_messages RESTART IDENTITY;
COMMIT;
SQL'

          echo '=== Verify cleaned tables are zero ==='
          verify_zero() {
            local db="$1" table="$2"
            local count
            count="$(docker exec "$PG_CONTAINER" sh -lc 'PGPASSWORD="${POSTGRES_PASSWORD:-}" psql -U "${POSTGRES_USER:-postgres}" -d "$1" -At -c "SELECT COUNT(*) FROM $2;"' sh "$db" "$table")"
            echo "ZERO_CHECK|$db|$table|$count"
            [ "$count" = "0" ]
          }
          verify_zero dhole_ai 'ai."AiExecutions"'
          verify_zero dhole_auditlogs 'auditlogs."AuditEvents"'
          verify_zero dhole_auth 'auth."Sessions"'
          verify_zero dhole_data_extraction 'data_extraction."ExtractionExecutions"'
          verify_zero dhole_notifications 'notifications.notification_messages'
          verify_zero dhole_pricing 'pricing."RateHeaders"'
          verify_zero dhole_pricing 'pricing."OwnLclConsolidations"'

          echo '=== Verify retained master/reference data still exists with exact expected counts ==='
          assert_count() {
            local db="$1" table="$2" expected="$3"
            local count
            count="$(docker exec "$PG_CONTAINER" sh -lc 'PGPASSWORD="${POSTGRES_PASSWORD:-}" psql -U "${POSTGRES_USER:-postgres}" -d "$1" -At -c "SELECT COUNT(*) FROM $2;"' sh "$db" "$table")"
            echo "KEEP_AFTER|$db|$table|$count"
            [ "$count" = "$expected" ]
          }
          assert_count dhole_auth 'auth."Users"' 4
          assert_count dhole_auth 'auth."Roles"' 3
          assert_count dhole_auth 'auth."Scopes"' 126
          assert_count dhole_config 'config."CatalogGroups"' 27
          assert_count dhole_config 'config."CatalogItems"' 453
          assert_count dhole_ai 'ai."AiConnections"' 1
          assert_count dhole_ai 'ai."AiModels"' 4
          assert_count dhole_ai 'ai."AiProfiles"' 3
          assert_count dhole_ai 'ai."AiProfileModels"' 9
          assert_count dhole_ai 'ai."AiPromptTemplates"' 3
          assert_count dhole_pricing 'pricing."ImportFclRates"' 12969
          assert_count dhole_pricing 'pricing."Costs"' 44
          assert_count dhole_pricing 'pricing."RateTermItems"' 60
          assert_count dhole_pricing 'pricing."RateTermBlocks"' 33
          assert_count dhole_pricing 'pricing."OwnLclHistoricalRates"' 48
          assert_count dhole_reports 'reports.report_templates' 3
          assert_count dhole_storage 'storage."Files"' 561

          echo '=== Resume Dhole application containers ==='
          cleanup_pause
          paused=()
          trap - EXIT

          echo '=== Health checks after reset ==='
          for url in \
            'http://localhost:5201/health' \
            'http://localhost:5202/health' \
            'http://localhost:5203/health' \
            'http://localhost:5205/health' \
            'http://localhost:5206/health' \
            'http://localhost:5207/health' \
            'http://localhost:5208/health' \
            'http://localhost:5209/health'; do
            for attempt in $(seq 1 20); do
              if curl -fsS "$url" >/dev/null; then
                echo "HEALTH_OK|$url"
                break
              fi
              if [ "$attempt" -eq 20 ]; then
                echo "HEALTH_FAILED|$url"
                exit 1
              fi
              sleep 2
            done
          done

          echo "RESET_COMPLETE|$backup_dir"

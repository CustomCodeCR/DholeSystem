name: Backup and reset production transactional data

on:
  push:
    branches: [ops-production-data-audit]
    paths:
      - '.github/workflows/reset-production-data.yml'

permissions:
  contents: read

jobs:
  reset:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
      - name: Backup, preflight, reset and verify production PostgreSQL
        shell: bash
        run: bash .github/scripts/reset-production-data.sh

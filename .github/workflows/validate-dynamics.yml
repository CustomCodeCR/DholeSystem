name: Validate Dynamics Gateway integration

on:
  push:
    branches: [master, develop]
    paths:
      - "deploy/docker-compose.dynamics.yml"
      - "deploy/docker-compose.services.yml"
      - "deploy/dynamics.env.example"
      - ".github/workflows/validate-dynamics.yml"
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  compose-static:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [Staging, Production]
    steps:
      - uses: actions/checkout@v4
      - name: Parse dedicated Dynamics Compose with non-secret placeholders
        shell: bash
        env:
          DYNAMICS_IMAGE_TAG: test
          DYNAMICS_POSTGRES_PASSWORD_FILE: /tmp/no-real-password
          DYNAMICS_DB_CONNECTION_FILE: /tmp/no-real-connection
          DYNAMICS_ENCRYPTION_KEY_FILE: /tmp/no-real-key
          DYNAMICS_CURSOR_KEY_FILE: /tmp/no-real-cursor
          DYNAMICS_ADMIN_OIDC_SECRET_FILE: /tmp/no-real-oidc
          DYNAMICS_DP_CERT_FILE: /tmp/no-real-pfx
          DYNAMICS_DP_PASSWORD_FILE: /tmp/no-real-password-pfx
          DYNAMICS_ADMIN_OIDC_AUTHORITY: https://login.microsoftonline.com/test/v2.0
          DYNAMICS_ADMIN_OIDC_CLIENT_ID: placeholder-admin
          DYNAMICS_M2M_AUTHORITY: https://login.microsoftonline.com/test/v2.0
          DYNAMICS_M2M_AUDIENCE: api://placeholder-resource
          DHOLE_API_PUBLIC_URL: https://api.example.com
          DHOLE_NETWORK: ci-dhole-test
          ASPNETCORE_ENVIRONMENT: ${{ matrix.target }}
        run: |
          set -euo pipefail
          docker compose -f deploy/docker-compose.dynamics.yml -p "ci-dynamics-${ASPNETCORE_ENVIRONMENT,,}" config -q
          docker compose -f deploy/docker-compose.dynamics.yml config --services | grep -qx dynamics-postgres
          docker compose -f deploy/docker-compose.dynamics.yml config --services | grep -qx dynamics-api
          docker compose -f deploy/docker-compose.dynamics.yml config --services | grep -qx dynamics-worker
          # No database ports published, and the gateway must be on a distinct network.
          ! docker compose -f deploy/docker-compose.dynamics.yml config | grep -q 'published: "5432"'
          grep -q 'Gateway__Routes__13__Prefix: "/api/dynamics-connector"' deploy/docker-compose.services.yml
          grep -q 'Gateway__Routes__13__StripPrefix: "true"' deploy/docker-compose.services.yml
          grep -q 'Gateway__HealthChecks__dynamics-connector' deploy/docker-compose.services.yml
          echo "Dedicated Dynamics Compose and Dhole Gateway route are valid."

name: Validate Dynamics in existing Dhole PostgreSQL

on:
  push:
    branches: [master, develop]
    paths:
      - "deploy/docker-compose.dynamics.yml"
      - "deploy/docker-compose.services.yml"
      - "docs/deployment/dynamics-gateway.md"
      - ".github/workflows/validate-dynamics.yml"
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  compose-static:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [Staging, Production]
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated Dynamics schema/database on existing Dhole network
        shell: bash
        env:
          DYNAMICS_IMAGE_TAG: test
          DYNAMICS_DB: dhole_dynamics_connector
          CORS_WEB_ORIGIN: https://ci.example.invalid
          POSTGRES_HOST: postgres
          POSTGRES_PORT: "5432"
          POSTGRES_USER: ci-placeholder
          POSTGRES_PASSWORD: ci-placeholder
          JWT_ISSUER: DholeAuthService
          JWT_AUDIENCE: DholeEcosystem
          JWT_SECRET: ci-placeholder-unused-by-ci
          DHOLE_NETWORK: ci-dhole-${{ matrix.target }}
          ASPNETCORE_ENVIRONMENT: ${{ matrix.target }}
        run: |
          set -euo pipefail
          docker compose -f deploy/docker-compose.dynamics.yml -p "ci-dynamics-${ASPNETCORE_ENVIRONMENT,,}" config -q
          for service in dynamics-api dynamics-worker dynamics-migrate dynamics-key-init; do
            docker compose -f deploy/docker-compose.dynamics.yml config --services | grep -qx "$service"
          done
          ! docker compose -f deploy/docker-compose.dynamics.yml config --services | grep -qx dynamics-postgres
          grep -q "DYNAMICS_AUTH_MODE: Dhole" deploy/docker-compose.dynamics.yml
          grep -q 'Gateway__Routes__13__Prefix: "/api/dynamics-connector"' deploy/docker-compose.services.yml
          grep -q 'Gateway__Routes__14__Prefix: "/api/dynamics-admin"' deploy/docker-compose.services.yml
          grep -q 'Gateway__Routes__14__StripPrefix: "true"' deploy/docker-compose.services.yml
          ! docker compose -f deploy/docker-compose.dynamics.yml config | grep -q 'published: "5432"'
          echo "Existing Dhole PostgreSQL, separate connector DB, DholeAuth and both gateway routes validated."

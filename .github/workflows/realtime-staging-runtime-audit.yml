name: Audit public staging realtime routing and stream

on:
  push:
    branches: [develop]
    paths:
      - 'scripts/realtime/audit_staging_runtime.sh'
      - '.github/workflows/realtime-staging-runtime-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-staging-realtime
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, dhole]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit public staging frontend, SignalR and Redis stream
        shell: bash
        run: bash scripts/realtime/audit_staging_runtime.sh

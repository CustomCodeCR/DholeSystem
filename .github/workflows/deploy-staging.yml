name: Deploy Dhole Infrastructure - Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhole-infrastructure-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]

    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Use server staging configuration
        shell: bash
        run: |
          set -euo pipefail
          test -r /opt/dhole/.env.staging
          test -r /opt/dhole/docker-compose.services.yml
          test -r /opt/dhole/docker-compose.staging.yml
          echo "DHOLE_ENV_FILE=/opt/dhole/.env.staging" >> "$GITHUB_ENV"
          echo "COMPOSE_FILE=/opt/dhole/docker-compose.services.yml" >> "$GITHUB_ENV"
          echo "COMPOSE_OVERRIDE=/opt/dhole/docker-compose.staging.yml" >> "$GITHUB_ENV"

      - name: Ensure staging network and shared services
        shell: bash
        run: |
          set -euo pipefail
          docker network inspect dhole-staging >/dev/null 2>&1 || docker network create dhole-staging

          OLLAMA_ID="$(docker ps -q --filter label=com.docker.compose.service=ollama | head -n1 || true)"
          if [[ -n "$OLLAMA_ID" ]]; then
            docker network connect --alias ollama dhole-staging "$OLLAMA_ID" 2>/dev/null || true
          fi

          TRAEFIK_ID="$(docker ps -q --filter label=com.docker.compose.service=traefik | head -n1 || true)"
          if [[ -z "$TRAEFIK_ID" ]]; then
            TRAEFIK_ID="$(docker ps --format '{{.ID}} {{.Image}} {{.Names}}' | awk 'tolower($0) ~ /traefik/ {print $1; exit}')"
          fi
          if [[ -z "$TRAEFIK_ID" ]]; then
            echo "Traefik container not found" >&2
            docker ps --format 'table {{.ID}}\t{{.Image}}\t{{.Names}}'
            exit 1
          fi

          docker network connect dhole-staging "$TRAEFIK_ID" 2>/dev/null || true
          docker network inspect dhole-staging --format '{{range .Containers}}{{println .Name}}{{end}}' | sort

      - name: Validate server staging compose
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            --env-file "$DHOLE_ENV_FILE" \
            -f "$COMPOSE_FILE" \
            -f "$COMPOSE_OVERRIDE" \
            -p dhole-staging \
            config -q

      - name: Verify staging containers and Traefik routes
        shell: bash
        run: |
          set -euo pipefail

          read_env() {
            local key="$1"
            grep -m1 "^${key}=" "$DHOLE_ENV_FILE" | cut -d= -f2- | tr -d '\r'
          }

          DHOLE_WEB_HOST="$(read_env DHOLE_WEB_HOST)"
          DHOLE_API_HOST="$(read_env DHOLE_API_HOST)"
          FENNEC_HOST="$(read_env FENNEC_HOST)"

          docker compose \
            --env-file "$DHOLE_ENV_FILE" \
            -f "$COMPOSE_FILE" \
            -f "$COMPOSE_OVERRIDE" \
            -p dhole-staging \
            ps dhole-web api-gateway website

          for host in "$DHOLE_WEB_HOST" "$DHOLE_API_HOST" "$FENNEC_HOST"; do
            echo "Testing Traefik route for $host"
            ok=0
            for attempt in $(seq 1 20); do
              code="$(curl -sS -o /tmp/route-body -w '%{http_code}' -H "Host: $host" http://127.0.0.1/ || true)"
              if [[ "$code" != "000" && "$code" != "404" && "$code" != "502" && "$code" != "503" && "$code" != "504" ]]; then
                echo "$host -> HTTP $code"
                ok=1
                break
              fi
              sleep 2
            done
            if [[ "$ok" != "1" ]]; then
              echo "Route failed for $host" >&2
              cat /tmp/route-body 2>/dev/null || true
              exit 1
            fi
          done

      - name: Show public staging DNS state
        shell: bash
        run: |
          set -euo pipefail
          for host in dhole.customcodecr.com dhole-api.customcodecr.com website-castrofallas.customcodecr.com; do
            echo "=== $host ==="
            getent ahostsv4 "$host" | head -n3 || true
          done

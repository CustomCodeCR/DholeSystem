name: Check production Pricing health

on:
  push:
    branches: [ops-production-data-audit]
    paths:
      - '.github/workflows/check-production-pricing-health.yml'

permissions:
  contents: read

jobs:
  check-pricing:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
      - name: Verify Pricing container health
        shell: bash
        run: |
          set -euo pipefail
          container=dhole-pricing-api-1
          for attempt in $(seq 1 30); do
            state="$(docker inspect -f '{{.State.Status}}' "$container")"
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container")"
            echo "PRICING_STATE|attempt=$attempt|state=$state|health=$health"
            if [ "$state" = running ] && [ "$health" = healthy ]; then
              echo 'PRICING_HEALTH_OK'
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs --tail 120 "$container" || true
              exit 1
            fi
            sleep 2
          done
